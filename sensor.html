<!DOCTYPE html>
<html>
<head>
  <title>Pressure Monitor</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>

</head>

<body style="background:#111; color:white; text-align:center; font-family:sans-serif;">

<h1>Pressure Monitor</h1>

<canvas id="gauge" width="400" height="200"></canvas>

<script>
const SUPABASE_URL = "https://yuqwdavxrjnzsfzofhtx.supabase.co/rest/v1/pressure?select=psi&order=time.desc&limit=1";
const API_KEY = "sb_publishable_ZC7GFOAFxyqqVuC4Ye5Jnw_1fSE4Qoe";

const ctx = document.getElementById('gauge').getContext('2d');

// Fake gauge using doughnut (more reliable)
const gauge = new Chart(ctx, {
  type: 'doughnut',
  data: {
    labels: ['Safe', 'Warning', 'Danger'],
    datasets: [{
      data: [10, 11, 9],
      backgroundColor: ['green', 'yellow', 'red'],
      borderWidth: 0
    }]
  },
  options: {
    rotation: -90,
    circumference: 180,
    cutout: '70%',
    plugins: {
      legend: { display: false }
    }
  }
});

let currentPSI = 0;

function drawNeedle(value) {
  const angle = (value / 30) * Math.PI;

  const x = 200;
  const y = 200;

  const ctx = gauge.ctx;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle - Math.PI);

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -100);
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'white';
  ctx.stroke();

  ctx.restore();

  ctx.font = "20px Arial";
  ctx.fillStyle = "white";
  ctx.fillText(value.toFixed(1) + " PSI", 160, 180);
}

async function fetchPressure() {
  try {
    const res = await fetch(SUPABASE_URL, {
      headers: {
        "apikey": API_KEY,
        "Authorization": "Bearer " + API_KEY
      }
    });

    const data = await res.json();

    if (data.length > 0) {
      currentPSI = data[0].psi;

      gauge.update();

      // redraw needle
      drawNeedle(currentPSI);
    }

  } catch (err) {
    console.error(err);
  }
}

setInterval(fetchPressure, 2000);
fetchPressure();

</script>

</body>
</html>
